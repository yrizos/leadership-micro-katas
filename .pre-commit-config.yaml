repos:
  - repo: local
    hooks:
      - id: branch-and-kata-check
        name: Branch naming and kata validation
        entry: .githooks/pre-commit
        language: script
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      - id: commit-msg-format
        name: Commit message format
        entry: .githooks/commit-msg
        language: script
        stages: [commit-msg]
