exclude: ^site/(static/fonts|assets/icons)/
repos:
  - repo: local
    hooks:
      - id: branch-and-kata-check
        name: Branch naming and kata validation
        entry: scripts/check-branch-and-katas.sh
        language: script
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
  - repo: https://github.com/jorisroovers/gitlint
    rev: acc9d9de6369b76d22cb4167029d2035e8730b98
    hooks:
      - id: gitlint
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c
    hooks:
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-merge-conflict
      - id: check-yaml
  - repo: https://github.com/mrtazz/checkmake
    rev: 59931d556f8f5cf4fbacf2c8390a8122ef7a881d
    hooks:
      - id: checkmake
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95
    hooks:
      - id: shellcheck
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca
    hooks:
      - id: actionlint
