repos:
  - repo: local
    hooks:
      - id: branch-and-kata-check
        name: Branch naming and kata validation
        entry: scripts/check-branch-and-katas.sh
        language: script
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
