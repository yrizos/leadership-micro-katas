baseURL = 'https://leadership-katas.yrizos.com/'
locale = 'en-us'
title = 'Leadership Micro Katas'
disableKinds = ['taxonomy', 'term']
enableGitInfo = true
enableRobotsTXT = true

[outputFormats.json]
  baseName = 'katas'

[outputFormats.llms]
  mediaType = 'text/plain'
  baseName = 'llms'
  isPlainText = true
  notAlternative = true

[outputFormats.print]
  mediaType = 'text/html'
  baseName = 'print'
  notAlternative = true

[outputFormats.markdown]
  mediaType = 'text/markdown'
  isPlainText = true
  ugly = true

[outputs]
  home = ['html', 'rss', 'json', 'llms', 'print']
  page = ['html', 'markdown']

[params]
  github = 'https://github.com/yrizos/leadership-micro-katas'

[[menus.main]]
  name = 'Katas'
  url = '/#katas'
  weight = 5
[[menus.main]]
  name = 'About'
  pageRef = '/about'
  weight = 10
[[menus.main]]
  name = 'Rationale'
  pageRef = '/rationale'
  weight = 20

[[cascade]]
  [cascade.build]
    render = 'never'
    list = 'local'
  [cascade.target]
    path = '{/katas,/examples,/examples/**}'

[module]
  [[module.mounts]]
    source = 'content'
    target = 'content'
  [[module.mounts]]
    source = '../katas'
    target = 'content/katas'
  [[module.mounts]]
    source = '../examples'
    target = 'content/examples'
