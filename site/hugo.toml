baseURL = 'https://example.org/'
locale = 'en-us'
title = 'Leadership Micro Katas'

[params]
  github = 'https://github.com/yrizos/leadership-micro-katas'

[[menus.main]]
  name = 'About'
  pageRef = '/about'
  weight = 10
[[menus.main]]
  name = 'Rationale'
  pageRef = '/rationale'
  weight = 20

[[cascade]]
  [cascade.build]
    render = 'never'
    list = 'local'
  [cascade.target]
    path = '{/katas,/examples,/examples/**}'

[[cascade]]
  [cascade.build]
    list = 'local'
  [cascade.target]
    path = '/katas/**'

[module]
  [[module.mounts]]
    source = 'content'
    target = 'content'
  [[module.mounts]]
    source = '../katas'
    target = 'content/katas'
  [[module.mounts]]
    source = '../examples'
    target = 'content/examples'
