name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - katas/**
      - examples/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      HUGO_VERSION: 0.169.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Hugo
        run: |
          wget -O "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - name: Install make and WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y make weasyprint
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build
        run: make pdf BASE_URL="${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-slim
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
